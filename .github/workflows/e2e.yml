# Scheduled E2E + regression tracking against an EPHEMERAL database — a copy-on-write Neon
# branch off the `baseline` seed branch (never off production). Instant, isolated, identical
# fixtures every run; torn down at the end. See docs/architecture/environments.md.
name: E2E

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  workflow_dispatch:

permissions:
  id-token: write # Infisical OIDC
  contents: read

jobs:
  e2e:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # CI infra secrets (NEON_API_KEY, NEON_PROJECT_ID) from a dedicated Infisical "ci" env.
      - name: Inject secrets (Infisical)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_CI_PROJECT_SLUG }}
          env-slug: ci

      - name: Expose Neon secrets
        id: neon-secrets
        run: |
          echo "::add-mask::$NEON_API_KEY"
          echo "project_id=$NEON_PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "api_key=$NEON_API_KEY" >> "$GITHUB_OUTPUT"

      # Branch off `baseline` (migrations + seed already applied) -> instant ready DB.
      - name: Create ephemeral Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6.4.0
        with:
          project_id: ${{ steps.neon-secrets.outputs.project_id }}
          parent_branch: baseline
          branch_name: e2e-${{ github.run_id }}
          api_key: ${{ steps.neon-secrets.outputs.api_key }}

      - name: Apply any newer migrations
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm --filter @stride/db db:migrate

      - name: Run E2E suite
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm turbo run test:e2e --if-present

      # Always tear the branch down, even if tests failed.
      - name: Delete ephemeral Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3.2.1
        with:
          project_id: ${{ steps.neon-secrets.outputs.project_id }}
          branch: e2e-${{ github.run_id }}
          api_key: ${{ steps.neon-secrets.outputs.api_key }}
