# Promote a commit to staging or production. One button. Same commit, promoted up the ladder.
# Production approval is enforced by the GitHub Environment protection rule (a second reviewer),
# configured in Settings -> Environments -> production -> Required reviewers.
name: Promote

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      ref:
        description: Commit SHA to deploy. Leave blank to use the latest commit on main.
        required: false
        type: string

permissions:
  id-token: write # propagated to the reusable workflow for Infisical OIDC
  contents: read

jobs:
  resolve:
    runs-on: depot-ubuntu-24.04
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - id: pick
        run: echo "sha=${{ inputs.ref || github.sha }}" >> "$GITHUB_OUTPUT"

  promote:
    needs: resolve
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ needs.resolve.outputs.sha }}
