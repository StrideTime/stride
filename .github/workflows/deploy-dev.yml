# dev deploys automatically on every merge to main. No buttons. This is the fast feedback loop.
name: Deploy dev

on:
  push:
    branches: [main]

permissions:
  id-token: write # propagated to the reusable workflow for Infisical OIDC
  contents: read

jobs:
  dev:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      ref: ${{ github.sha }}
